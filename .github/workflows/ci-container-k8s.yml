name: CI, GHCR container, and local Kubernetes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: possible-production-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Run production build and tests
        run: npm test

  publish-platform:
    name: Build and publish ${{ matrix.platform }} image
    if: github.event_name != 'pull_request'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.title=Possible
            org.opencontainers.image.description=Probability-weighted stock scenario research agent with Codex CLI
      - name: Build and push platform image by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
          provenance: true
          sbom: true
      - name: Export image digest
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image manifest
    if: github.event_name != 'pull_request'
    needs: publish-platform
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v5
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Possible
            org.opencontainers.image.description=Probability-weighted stock scenario research agent with Codex CLI
      - name: Create and inspect multi-platform manifest
        id: manifest
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "$tag")
          done <<< "$TAGS"

          digest_refs=()
          for digest in *; do
            digest_refs+=("$IMAGE@sha256:$digest")
          done

          docker buildx imagetools create "${tag_args[@]}" "${digest_refs[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE@$digest"
      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy to local Kubernetes
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: read
      packages: read
    environment: local-k8s
    env:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      FALLBACK_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KUBE_CONTEXT: ${{ vars.LOCAL_KUBE_CONTEXT }}
      CODEX_AUTH_FILE: ${{ vars.LOCAL_CODEX_AUTH_FILE }}
    steps:
      - name: Check out deployment manifests
        uses: actions/checkout@v7
      - name: Select and verify local cluster
        shell: bash
        run: |
          context="${KUBE_CONTEXT:-docker-desktop}"
          kubectl config use-context "$context"
          kubectl cluster-info
      - name: Create namespace
        run: kubectl apply -f k8s/namespace.yaml
      - name: Refresh GHCR pull credentials
        shell: bash
        run: |
          password="${GHCR_PAT:-$FALLBACK_GHCR_TOKEN}"
          kubectl -n possible create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${GITHUB_ACTOR}" \
            --docker-password="$password" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Refresh ChatGPT subscription authentication
        shell: bash
        run: |
          auth_file="${CODEX_AUTH_FILE:-$HOME/.codex/auth.json}"
          if [[ ! -s "$auth_file" ]]; then
            echo "Codex authentication was not found at $auth_file" >&2
            echo "Run 'codex login' as the local runner user or set LOCAL_CODEX_AUTH_FILE." >&2
            exit 1
          fi
          kubectl -n possible create secret generic codex-auth-bootstrap \
            --from-file=auth.json="$auth_file" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Apply Kubernetes resources
        run: kubectl apply -k k8s
      - name: Pin deployment and init container to published digest
        env:
          IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: |
          kubectl -n possible set image deployment/possible \
            possible="$IMAGE" \
            prepare-codex-auth="$IMAGE"
      - name: Wait for healthy rollout
        run: kubectl -n possible rollout status deployment/possible --timeout=10m
      - name: Verify Codex authentication and application health
        shell: bash
        run: |
          pod="$(kubectl -n possible get pod \
            -l app.kubernetes.io/name=possible \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}')"
          kubectl -n possible wait --for=condition=Ready "pod/$pod" --timeout=2m
          kubectl -n possible exec -c possible "$pod" -- codex login status
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8080/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Application health endpoint did not stabilize" >&2
          exit 1
      - name: Show deployed endpoint
        run: |
          kubectl -n possible get deployment,pods,service
          echo "Possible is available at http://localhost:8080."
