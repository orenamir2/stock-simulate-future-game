apiVersion: apps/v1
kind: Deployment
metadata:
  name: possible
  namespace: possible
  labels:
    app.kubernetes.io/name: possible
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: possible
  template:
    metadata:
      labels:
        app.kubernetes.io/name: possible
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: possible
          image: ghcr.io/orenamir2/stock-simulate-future-game:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: CODEX_HOME
              value: /var/lib/codex
            - name: STOCK_ANALYSIS_SCHEMA_PATH
              value: /app/config/stock-analysis.schema.json
            - name: CODEX_TIMEOUT_MS
              value: "600000"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: codex-home
              mountPath: /var/lib/codex
      initContainers:
        - name: prepare-codex-auth
          image: ghcr.io/orenamir2/stock-simulate-future-game:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - install -m 600 /codex-auth-source/auth.json /var/lib/codex/auth.json
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: codex-auth-source
              mountPath: /codex-auth-source
              readOnly: true
            - name: codex-home
              mountPath: /var/lib/codex
      volumes:
        - name: tmp
          emptyDir: {}
        - name: codex-home
          emptyDir:
            medium: Memory
        - name: codex-auth-source
          secret:
            secretName: codex-auth-bootstrap
            defaultMode: 0440
