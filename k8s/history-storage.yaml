apiVersion: v1
kind: PersistentVolume
metadata:
  name: possible-analysis-history
  labels:
    app.kubernetes.io/name: possible
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: possible-host-storage
  hostPath:
    path: /Users/orenamir2icloud.com/Documents/ChatGPT/stock-simulate-future-game/data/analysis-history
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: possible-analysis-history
  namespace: possible
  labels:
    app.kubernetes.io/name: possible
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: possible-host-storage
  resources:
    requests:
      storage: 1Gi
